name: Build

on:
  push:
    branches: trunk
    tags: 'v*'
  pull_request:
    branches: '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U jupyterlab~=4.0

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "icos-ext.*OK"
        python -m jupyterlab.browser_check

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "icos-ext" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v4
      with:
        name: extension-artifacts
        path: dist/icos_ext*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        architecture: 'x64'
    - uses: actions/download-artifact@v4
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab~=4.0" icos_ext*.whl


        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "icos-ext.*OK"
        python -m jupyterlab.browser_check --no-chrome-test

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test_isolated
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: extension-artifacts
        path: dist
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -eux
        version=$(jq -r .version package.json)
        if [ "$TAG" != "v$version" ]; then
          echo "Tag $TAG does not match package.json version $version" >&2
          exit 1
        fi

        # A version with a suffix, e.g. 0.3.0-alpha.0, is published as a pre-release.
        prerelease=()
        case "$version" in *-*) prerelease=(--prerelease) ;; esac

        gh release create "$TAG" dist/icos_ext* --generate-notes "${prerelease[@]}"
